apiVersion: v2
name: demo-java-helm
description: A demo Java Helm chart for DSO tutorial
type: application
version: 0.1.0
appVersion: "1.16.0"
# Test-only dependency: makes Argo CD's repo-server log in to Docker Hub
# (registry-1.docker.io/bitnamicharts) to build the chart. Disabled in values.yaml,
# so nothing is deployed.
dependencies:
  - name: nginx
    version: "25.2.1"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: nginx.enabled
